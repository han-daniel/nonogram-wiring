<script id="engineJs">
function confPct(c){
  const v = (c || 0) * 100;
  return (v > 0 && v < 0.5) ? '<1' : String(Math.round(v));
}
function confApprox(c){
  const v = (c || 0) * 100;
  return (v > 0 && v < 0.5) ? '<1%' : '~' + Math.round(v) + '%';
}
function loneReading(n){ return ((n && n.alts) || []).length === 1; }
const SCORE_DECILES = [-4.75, 0.25, 0.6, 1.15, 1.2, 1.6, 1.6, 1.65, 1.9, 2.2, 2.2];
function scoreStanding(score){
  let i = 0;
  while (i < SCORE_DECILES.length && SCORE_DECILES[i] <= score) i++;
  const pct = Math.max(0, Math.min(100, (i - 1) * 10));
  return pct < 20 ? 'in the weakest ' + (pct + 10) + '% of student readings'
                  : 'stronger than ' + pct + '% of student readings';
}
function confWhy(n, cand){
  if (!cand || !cand.parts || !cand.parts.length) return '';
  const alts = (n && n.alts) || [];
  const Z = alts.reduce((a, c) => a + Math.exp(c.score), 0);
  const head = cand.parts[0].v.toFixed(2) + ' ' + cand.parts[0].k;
  const rest = cand.parts.slice(1)
    .map(p => (p.v < 0 ? ' − ' : ' + ') + Math.abs(p.v).toFixed(2) + ' ' + p.k).join('');
  if (loneReading(n))
    return ' · the only reading found — its cost: ' + head + rest +
           ' = ' + cand.score.toFixed(2) + ', ' + scoreStanding(cand.score);
  return ' · why ' + confPct(cand.conf) + '%: ' + head + rest +
         ' = ' + cand.score.toFixed(2) +
         ', e^' + cand.score.toFixed(2) + ' = ' + Math.exp(cand.score).toFixed(2) +
         ' out of ' + Z.toFixed(2) + ' over ' + alts.length + ' readings · ' +
         scoreStanding(cand.score);
}
function escHtml(t){
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function confTable(n, viewC){
  const A = (n && n.alts) || [];
  if (!A.length || !A[0] || !A[0].parts) return '';
  const Z = A.reduce((a, c) => a + Math.exp(c.score), 0);
  const cell = (t, extra) => '<td style="padding:2px 9px 2px 0;' + (extra || '') + '">' + t + '</td>';
  const rows = A.map(c => {
    const on = c === viewC;
    const terms = (c.parts || []).map((p, i) => i === 0
      ? p.v.toFixed(2)
      : ' ' + (p.v < 0 ? '−' : '+') + ' ' + Math.abs(p.v).toFixed(2) + ' ' + p.k).join('');
    return '<tr style="' + (on ? 'color:#C0693A;font-weight:700' : 'opacity:0.7') + '">' +
      cell((on ? '▸ ' : '') + escHtml(c.tech), 'white-space:nowrap') +
      cell(escHtml(c.ln), 'white-space:nowrap') +
      cell(escHtml(terms)) +
      cell(c.score.toFixed(2), 'text-align:right') +
      cell(Math.exp(c.score).toFixed(2), 'text-align:right') +
      cell(confPct(c.conf) + '%', 'text-align:right') + '</tr>';
  }).join('');
  return '<div class="tablewrap" style="margin-top:7px">' +
    '<table style="font-size:11.5px;border-collapse:collapse;width:auto;margin:0">' +
    '<tr style="opacity:0.5">' + cell('reading', 'white-space:nowrap') + cell('via') +
      cell('what it costs') + cell('score', 'text-align:right') +
      cell('e^score', 'text-align:right') + cell('share', 'text-align:right') + '</tr>' +
    rows +
    '<tr style="opacity:0.5">' +
      '<td colspan="4" style="padding:3px 9px 0 0;text-align:right">total</td>' +
      '<td style="padding:3px 9px 0 0;text-align:right">' + Z.toFixed(2) + '</td>' +
      '<td style="padding:3px 0 0 0;text-align:right">100%</td></tr>' +
    '</table></div>';
}

                      wrongAtTime: contradictsSolution(St, nd) || nd.status === 'wrong',

  }

  const BACK_DIM = 0.5;      // supporting chains behind the lit reading: readable, subordinate
  let recalled = null;
  let timeMode = false;   // forest x: packed evenly, or spaced by when the move happened
  let selGhost = null, gView = null;

  function placements(clue, n){
    const out = [], k = clue.length;
    const suffix = Array(k + 1).fill(0);
    for (let i = k - 1; i >= 0; i--) suffix[i] = suffix[i + 1] + clue[i] + 1;
    (function rec(i, pos, line){
      if (i === k){ const l = line.slice(); while (l.length < n) l.push(0); out.push(l); return; }
      const maxStart = n - (suffix[i] - 1);
      for (let s = pos; s <= maxStart; s++){
        const l = line.slice();
        while (l.length < s) l.push(0);
        for (let j = 0; j < clue[i]; j++) l.push(1);
        if (i < k - 1) l.push(0);

      }
    })(0, 0, []);
    return out;
  }
  function classify(clue, prem, idx, v){
    const keys = [...prem.keys()];
    const shaded = keys.filter(p => prem.get(p) === 1).sort((a, b) => a - b);
    if (keys.length === 0) return v === 1 ? 'simple boxes' : 'simple spaces';
    const mx = Math.max.apply(null, clue);
    if (v === 1){
      const left = shaded.filter(p => p < idx), right = shaded.filter(p => p > idx);
      if (left.length && right.length &&
          (idx - Math.max.apply(null, left) + Math.min.apply(null, right) - idx) <= mx)

      if (idx < Math.min.apply(null, shaded) || idx > Math.max.apply(null, shaded)) return 'mercury';

        const key = K(cell[0], cell[1]);
        if (marks.has(key)) return;
        const v0 = opts[0][i];
        for (let j = 1; j < opts.length; j++) if (opts[j][i] !== v0) return;

        l.cells.forEach((cell, i) => {

          if (cl.has(key) || (batch && batch.some(x => x[0] === key))) return;

      .map((cell, i) => ({pos: i, key: K(cell[0], cell[1])}))

      const onThisLine = k => l.cells.some(cell => K(cell[0], cell[1]) === k);
      const nExp = sup => sup.filter(y => explicitHas.has(y.key)).length;
      const nSame = sup => sup.filter(y => !explicitHas.has(y.key) && onThisLine(y.key)).length;
      for (let guard = 0; guard < 8; guard++){
        let moved = false;
        for (let j = 0; j < support.length; j++){

      if (ch) ch.depth = n.depth;
    };
    for (let pass = 0; pass < 3; pass++){
      order.forEach(n => {
        const self = K(n.r, n.c);
        if (!n.premises.length){
          if (n.status !== 'wrong') n.valid = n.valid !== false;
          return;
        }
        let dmax = 0, okv = n.status !== 'wrong';
        n.premises.forEach((pk, i) => {
          const pn = S.nodes.get(pk);
          if (!pn){ okv = false; return; }
          if (dependsOn(S, pk, self, new Set())) return;
          dmax = Math.max(dmax, pn.depth || 0);
          if (n.premVals && n.premVals[i] !== undefined && pn.v !== n.premVals[i]) okv = false;
          if (pn.valid === false) okv = false;
        });
        n.depth = 1 + dmax;
        n.valid = okv;
        stampChosen(n);
      });
    }
  }
  function replayAll(){
    const S = newState();
    moves.forEach(mv => step(S, mv));

  }

  function geom(pz){
    const C = pz.cols.length;
    const cs = C <= 6 ? 36 : (C <= 15 ? 24 : 18);
    return {
      cs: cs,
      step: C <= 6 ? 15 : (C <= 15 ? 12 : 10),
      font: C <= 6 ? 12 : (C <= 15 ? 10.5 : 9.5),
      big: C > 6,
    };
  }

  function renderDag(S){
    if (!$(cfg.dagId)) return;
    const big = S.log.length > 60 || S.pz.cols.length > 6;
    const NW = big ? 26 : 34, NH = big ? 16 : 22, NF = big ? 7.5 : 10;
    const colStep = big ? 34 : 54, bandH = big ? 56 : 78;
    const selN0 = sel ? S.nodes.get(sel) : null;
    const viewC0 = (selN0 && selN0.alts && selN0.alts.length)
      ? (selAlt < 0 ? null : selN0.alts[Math.min(selAlt, selN0.alts.length - 1)]) : null;
    const selGuessD = !!(sel && S.nodes.get(sel) && selAlt < 0 && guessViewable(S, S.nodes.get(sel)));
    const dep = n => {
      if (selGuessD && K(n.r, n.c) === sel) return 0;   // a guess has no depth: band d0
      if (viewC0 && K(n.r, n.c) === sel && bandMode === 'real') return viewC0.depth;
      if (bandMode === 'floor') return (n.dmin !== undefined ? n.dmin : n.depth);
      return n.depth;
    };
    const byD = {};
    S.log.forEach((n, i) => { n.id = i; (byD[dep(n)] = byD[dep(n)] || []).push(n); });
    (S.virtuals || []).forEach(n => { (byD[dep(n)] = byD[dep(n)] || []).push(n); });
    Object.keys(byD).forEach(dd => byD[dd].sort((a, b) =>
      (a.virtual ? a.instAt - 0.5 : a.seq) - (b.virtual ? b.instAt - 0.5 : b.seq)));
    const keysD = Object.keys(byD).map(Number);
    const maxD = keysD.length ? Math.max.apply(null, keysD) : 0;
    const maxRow = Math.max.apply(null, [1].concat(Object.values(byD).map(a => a.length)));
    const tOf = n => (n.virtual ? (n.instAt || 1) - 0.5 : n.seq);
    const stepT = big ? 24 : 38;
    const PER = 8;                       // most nodes a band may put in one sub-row
    const Wd = timeMode
      ? Math.max(380, 70 + (S.log.length + 0.5) * stepT)
      : Math.max(380, 70 + Math.min(maxRow, PER) * colStep);
    const subH = big ? 42 : 56;
    const rowsOf = dd => timeMode
      ? 1 : Math.max(1, Math.ceil((((byD[dd] || []).length) || 1) / PER));
    const bandTop = [];
    let acc = 0;
    for (let dd = 0; dd <= maxD; dd++){
      bandTop[dd] = acc;
      acc += bandH + (rowsOf(dd) - 1) * subH;
    }
    const chunkPend = [];
    const yOfBand = dd => 32 + (bandTop[Math.min(dd, maxD)] || 0);
    const H = 40 + acc;
    const pos = {};
    let s = '';
    for (let dd = 0; dd <= maxD; dd++){
      const rws = rowsOf(dd);
      s += '<rect data-fband="' + dd + '" style="cursor:pointer" x="30" y="' + (yOfBand(dd) - NH / 2 - 8) + '" width="' + (Wd - 44) + '" height="' + (NH + 16 + (rws - 1) * subH + (chunkView ? 5 : 0)) + '" rx="9" fill="currentColor" opacity="0.07"/>';
      const bandKeys = new Set((byD[dd] || []).map(n2 => K(n2.r, n2.c)));
      const chunkGroups = [];
      if (chunkView) S.lines.forEach(L2 => {
        const runs2 = [];
        { let run2 = [];
          L2.cells.forEach(cell => {
            if (S.pz.sol[cell[0]][cell[1]] === '#') run2.push(K(cell[0], cell[1]));
            else { if (run2.length) runs2.push(run2); run2 = []; } });
          if (run2.length) runs2.push(run2); }
        runs2.forEach(cellsOfBlock => {
          const hit = cellsOfBlock.filter(k3 => bandKeys.has(k3));
          if (hit.length >= 2) chunkGroups.push({o: L2.o, cells: hit});
        }); });
      const bandCells = (byD[dd] || []);
      let bEarn = 0, bTot = 0;
      bandCells.forEach(n2 => {
        if (n2.virtual) return;
        bTot++;
        const h2 = n2.dmin !== undefined ? n2.dmin : (n2.depth || 0);
        const below = (n2.depth || 0) < h2;
        if ((n2.status === 'derived' || n2.status === 'implied') && !below) bEarn++;
      });
      const bPct = bTot ? Math.round(100 * (bTot - bEarn) / bTot) : 0;
      s += '<text x="8" y="' + (yOfBand(dd) + 4) + '" font-size="10.5" class="mono" fill="currentColor" opacity="0.55">' + (bandMode === 'floor' ? 'h' : 'd') + dd +
        '<title>' + (bandMode === 'floor' ? 'board round h' : 'reasoning depth d') + dd + ' — ' +
        bTot + ' mark' + (bTot === 1 ? '' : 's') + ', ' +
        (bTot === 0 ? 'none placed' : bPct === 0 ? 'all of it earned'
          : bPct === 100 ? 'none of it earned — every mark here is a guess or rests on one'
          : bPct + '% not earned') + '</title></text>';
      if (bTot && bPct)
        s += '<rect x="8" y="' + (yOfBand(dd) + 7) + '" width="' + (14 * bPct / 100).toFixed(1) +
             '" height="2" rx="1" fill="#D9A23B" fill-opacity="0.75"><title>' + bPct +
             '% of this band is not earned</title></rect>';
      chunkPend.push({dd: dd, groups: chunkGroups});
      const cnt = (byD[dd] || []).length;
      const perRow = Math.max(1, Math.ceil(cnt / rws));   // even split, not a ragged tail
      (byD[dd] || []).forEach((n, k) => {
        const ri = Math.floor(k / perRow), col = k - ri * perRow;
        const inRow = Math.min(perRow, cnt - ri * perRow);
        pos[K(n.r, n.c)] = [timeMode ? 52 + (tOf(n) - 0.5) * stepT
                                     : 52 + (col + 0.5) * (Wd - 80) / inRow,
                            yOfBand(dd) + ri * subH];
      });
    }
    chunkPend.forEach(pend => {
      pend.groups.forEach(g2 => {
        const pts = g2.cells.map(k3 => pos[k3]).filter(Boolean);
        if (pts.length < 2) return;
        const fade = bandSel !== null && pend.dd !== bandSel ? DIM_UNLIT : 1;
        const dash = g2.o === 'r' ? '' : ' stroke-dasharray="1 4"';
        const byRow = new Map();
        pts.forEach(q => (byRow.get(q[1]) || byRow.set(q[1], []).get(q[1])).push(q[0]));
        byRow.forEach((rowXs, y) => {

                   '><title>part of a chunk whose other cells were played elsewhere</title></path>';

            s += '<path pointer-events="none" d="M ' + a + ' ' + (yy - 4) + ' L ' + a + ' ' + yy +
                 ' L ' + b + ' ' + yy + ' L ' + b + ' ' + (yy - 4) + '" fill="none" stroke="#C0693A"' +
                 ' stroke-opacity="' + (0.95 * fade) + '" stroke-width="2.4" stroke-linejoin="round"' +
                 ' stroke-linecap="round"' + dash +
                 '><title>' + run.length + ' cells of one clue, played back to back</title></path>';
          };
          for (let i = 1; i < rowXs.length; i++){
            if (rowXs[i] - run[run.length - 1] > colStep * 1.35){ flush(); run = [rowXs[i]]; }
            else run.push(rowXs[i]);
          }
          flush();
        });
      });
    });
    const selNode = sel ? S.nodes.get(sel) : null;
    const viewCP = (selNode && selNode.alts && selNode.alts.length)
      ? (selAlt < 0 ? null : selNode.alts[Math.min(selAlt, selNode.alts.length - 1)]) : null;
    const selPrem = new Set(selGuessD ? []
                          : viewCP ? viewCP.support.map(x => x.key)
                                   : (selNode ? selNode.premises : []));
    const BCd = blockCells(S);
    const onLineD = new Set();
    if (BCd) BCd.L.cells.forEach(c2 => onLineD.add(K(c2[0], c2[1])));
    const lineDimD = k2 => !lineSel ? 1
      : (BCd && BCd.env.has(k2) ? 1 : (onLineD.has(k2) ? 0.55 : DIM_UNLIT));
    let lin = null;
    if (selNode){
      lin = new Set([sel]);
      const stack = [...selPrem];
      while (stack.length){
        const k2 = stack.pop();
        if (lin.has(k2)) continue;
        lin.add(k2);
        const nd = S.nodes.get(k2);
        if (nd) nd.premises.forEach(pk => { if (!lin.has(pk)) stack.push(pk); });
      }
    }
    let ovl = '', ovlEdges = '';
    if (selNode && viewCP && pos[sel]){
      const pT = pos[sel];

            const oe = /([\d.-]+) ([\d.-]+)$/.exec(geo.d), ne2 = /([\d.-]+) ([\d.-]+)$/.exec(nd);
            const os = /^M ([\d.-]+) ([\d.-]+)/.exec(geo.d), ns2 = /^M ([\d.-]+) ([\d.-]+)/.exec(nd);

          (selEp.gone

  function render(){

    const S = St;
    const forced = forcedNow(S.lines, S.board);

  function couplingNote(n){
    const why = couplingGateReason(St);
    if (why) return ' \u00b7 coupling not checked here \u2014 ' + why +
                    ' (it needs one replay per reading and would hang the tab)';
    const m = couplingMapOf(St);
    const c = m && m.get(K(n.r, n.c));
    return c ? ' · coupled: choosing among this cell\u2019s readings would change ' + c +
               ' later move' + (c === 1 ? '' : 's') : '';
  }
  let renarrCache = {key: null, val: ''};
  function renarrNote(n){
    if (!acts.length || !acts.some(a => a.t !== 'f')) return '';
    const k = K(n.r, n.c);
    let at = -1;
    for (let i = 0; i < acts.length; i++){
      const a = acts[i];
      if (a.t === 'f' && K(a.r, a.c) === k) at = i;
      else if (a.t === 'u' && K(a.r, a.c) === k) at = -1;
      else if (a.t !== 'f' && a.t !== 'u') at = -1;
    }
    if (at < 0) return '';
    const key = k + '|' + at + '|' + acts.length + '|' + (acts[at] === renarrCache.act ? 1 : 0);
    if (renarrCache.key === key) return renarrCache.val;
    const S2 = newState();
    survActs(at + 1).forEach(mv => step(S2, mv));
    const m = S2.log[S2.log.length - 1];
    let out = '';
    if (m){
      const srt = a2 => (a2 || []).slice().sort().join(' ');
      const diff = m.status !== n.status || (m.depth || 0) !== (n.depth || 0) ||
        srt(m.premises) !== srt(n.premises);
      if (diff)
        out = ' · re-narrated — this reading is reconstructed from the final board; when the mark was made (act ' +
          (at + 1) + ') it read ' +
          (m.status === 'guess' || m.status === 'wrong'
            ? 'as a guess: nothing on the board then supported it'
            : m.status + ' at d' + (m.depth || 0) +
              (m.line ? ' via ' + m.line.ln + ' — ' + m.tech : ''));
    }
    renarrCache = {key: key, val: out, act: acts[at]};
    return out;
  }
  const altOrder = n => {
    const A = (n && n.alts) || [];
    return A.map((a, i) => i)
            .sort((i, j) => ((A[i].depth || 0) - (A[j].depth || 0)) || (i - j));
  };
  function guessViewable(S2, n){
    if (!n || n.virtual || !n.alts || !n.alts.length) return false;
    const cand = n.alts.find(a => a.isChosen) || n.alts[0];
    const sup = n.premises || [];
    const allImputed = sup.length > 0 && !sup.some(k => S2.board.has(k));
    return allImputed || cand.score < SCORE_DECILES[2];
  }
  const sigOfSel = () => {
    if (sel === null) return null;
    const n = St.nodes.get(sel);
    const A = (n && n.alts) || [];
    return A[selAlt] ? A[selAlt].sig : null;
  };
  function syncHistFromSel(){
    if (!$(cfg.histId)) return;                 // no history panel on this surface
    if (sel === null){ histSel = null; histAlt = 0; return; }
    const eps = histEpisodes();
    let target = null;
    eps.forEach(e => { if (e.k !== sel) return;
      if (!e.gone){ if (!target || target.gone || e.at > target.at) target = e; }
      else if (!target || (target.gone && e.at > target.at)) target = e; });
    if (!target){ histSel = null; histAlt = 0; return; }
    histSel = target.at; histAlt = 0;
    const want = sigOfSel();
    if (!want || !target.then) return;
    if (target.then.sig === want) return;        // the act-time reading is the one being viewed
    const ps = (target.then.parses || []).slice().sort((a, b) => (a.depth || 0) - (b.depth || 0));
    const j = ps.findIndex(x => x.sig === want);
    if (j >= 0) histAlt = j + 1;
  }
  function syncSelFromHist(){
    if (histSel === null){ sel = null; selAlt = 0; selSeen = 0; selGhost = null; return; }
    const e = histEpisodes().find(x => x.at === histSel);
    if (!e || !St.board.has(e.k) || !St.nodes.has(e.k)){
      sel = null; selAlt = 0; selSeen = 0; selGhost = null; return;
    }
    const n = St.nodes.get(e.k), A = (n && n.alts) || [];
    sel = e.k; selGhost = null; selSeen = 1;
    const ci = A.findIndex(a => a.isChosen);
    selAlt = ci >= 0 ? ci : 0;
    const th = e.then;
    const want = histAlt === 0
      ? (th && th.sig)
      : (() => { const ps = ((th && th.parses) || []).slice().sort((a, b) => (a.depth || 0) - (b.depth || 0));
                 return ps[histAlt - 1] ? ps[histAlt - 1].sig : null; })();
    if (!want) return;
    const j = A.findIndex(a => a.sig === want);
    if (j >= 0) selAlt = j;
  }
  function clearSel(){
    sel = null; selAlt = 0; selSeen = 0; selGhost = null;
    histSel = null; histAlt = 0; chunkSel = null;
  }
  function anySel(){ return sel !== null || histSel !== null || lineSel !== null ||
                            bandSel !== null || chunkSel !== null; }
  function toggleSel(key){
    selGhost = null; lineSel = null; bandSel = null;
    const n = St.nodes.get(key);
    const extra = guessViewable(St, n) ? 1 : 0;
